apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'kotlin-android-extensions'
//apply plugin: 'kotlin-parcelize'
//apply plugin: 'io.fabric'
apply plugin: 'com.bugsnag.android.gradle'

def configuration = rootProject.ext.configuration

android {
    compileSdkVersion configuration.compileSdkVersion

    flavorDimensions "build"
    productFlavors {
        dev {
            dimension "build"
            applicationIdSuffix ".dev"
            minSdkVersion configuration.devMinSdkVersion
        }
        prod {
            dimension "build"
            minSdkVersion configuration.minSdkVersion
        }
    }

    defaultConfig {
        applicationId configuration.package
        minSdkVersion configuration.minSdkVersion
        targetSdkVersion configuration.targetSdkVersion
        versionCode configuration.versionCode
        versionName configuration.versionName
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

//    dataBinding {
//        enabled = true
//    }

    afterEvaluate {
        if (project.plugins.hasPlugin("kotlin-kapt")) {
            kapt {
                javacOptions {
                    option("-Xmaxerrs", 100000)
                }
            }
        }
    }

    kapt {
        javacOptions {
            option("-Xmaxerrs", 500)
        }
    }

    androidExtensions {
        experimental = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()//'11'
    }
    buildFeatures {
        viewBinding true
        dataBinding true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation"org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"//-jdk7
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.core:core-ktx:1.7.0-beta02'
    implementation 'com.google.android.material:material:1.5.0-alpha04'
    implementation 'com.android.support:design:28.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'
    implementation "com.android.support:support-compat:28.0.0"

//    implementation "com.google.dagger:dagger-android:2.22.1"
    implementation 'com.google.dagger:dagger-android:2.39.1'
    implementation 'com.google.dagger:dagger-android-support:2.39.1'
    implementation "io.reactivex.rxjava2:rxandroid:2.1.1"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.4.0-rc01'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-reactivestreams-ktx:2.4.0-rc01'
    implementation 'com.google.code.gson:gson:2.8.8'

    implementation "androidx.room:room-runtime:2.4.0-alpha05"
    implementation "androidx.room:room-rxjava2:2.4.0-alpha05"

    implementation "android.arch.work:work-runtime-ktx:1.0.1"
    implementation "android.arch.work:work-rxjava2:1.0.1"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.andrognito.patternlockview:patternlockview:1.0.0'

    implementation 'com.facebook.android:facebook-core:12.0.0'

    implementation 'com.google.firebase:firebase-core:19.0.2'
    implementation 'com.google.firebase:firebase-analytics:19.0.2'
//    implementation 'com.crashlytics.sdk.android:crashlytics:2.10.1'

    implementation 'com.daimajia.easing:library:2.4@aar'
    implementation 'com.daimajia.androidanimations:library:2.4@aar'

    implementation 'com.wei.android.lib:fingerprintidentify:1.2.6'
    implementation 'com.github.iammert:beaver:1.1'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.googlecode.libphonenumber:libphonenumber:8.12.35'
    implementation 'org.ocpsoft.prettytime:prettytime:5.0.2.Final'

    implementation 'com.bugsnag:bugsnag-android:5.14.0'
//    implementation 'com.bugsnag:bugsnag-android:7.+'
    implementation 'com.facebook.conceal:conceal:2.0.2'
    implementation 'com.github.tbruyelle:rxpermissions:0.10.2'

    implementation 'com.google.firebase:firebase-ads:20.4.0'

    implementation 'com.facebook.stetho:stetho:1.6.0'

    kapt 'com.google.dagger:dagger-compiler:2.39.1'
    kapt 'com.google.dagger:dagger-android-processor:2.39.1'
    kapt "androidx.lifecycle:lifecycle-compiler:2.4.0-rc01"
    kapt "androidx.room:room-compiler:2.4.0-alpha05"
}

